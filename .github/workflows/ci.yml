name: Test NeuroFriend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile source
        run: python -m compileall -q main.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
