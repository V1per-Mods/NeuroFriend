name: Build Windows release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile source
        run: python -m compileall -q main.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name NeuroFriend main.py
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeuroFriend-Windows
          path: dist/NeuroFriend.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: NeuroFriend \${{ github.ref_name }}
          generate_release_notes: true
          files: dist/NeuroFriend.exe
