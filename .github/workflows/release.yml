name: Build Windows release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish NeuroFriend v2.0.0 as a GitHub Release"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile source
        run: python -m compileall -q main.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name NeuroFriend main.py
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeuroFriend-Windows
          path: dist/NeuroFriend.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          name: NeuroFriend ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.0.0' }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.0.0' }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          overwrite_files: true
          files: dist/NeuroFriend.exe
