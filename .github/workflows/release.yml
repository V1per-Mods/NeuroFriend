name: Build all-in-one Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the all-in-one installer as a GitHub Release"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-installer:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Build bundled NeuroFriend release'))
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile source and run tests
        shell: pwsh
        run: |
          python -m compileall -q main.py
          if ($LASTEXITCODE -ne 0) { throw "Python compilation failed" }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Unit tests failed" }
      - name: Build application executable
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller install failed" }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name NeuroFriend main.py
          if ($LASTEXITCODE -ne 0) { throw "Application EXE build failed" }
      - name: Download the quantized Qwen model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle\models, bundle\runtime | Out-Null
          $modelUrl = "https://huggingface.co/bartowski/Qwen2.5-3B-Instruct-GGUF/resolve/main/Qwen2.5-3B-Instruct-Q4_K_S.gguf?download=true"
          # Hugging Face can rate-limit anonymous hosted runners (HTTP 429); use a longer backoff.
          curl.exe -L --fail --retry 12 --retry-all-errors --retry-delay 20 --retry-max-time 1800 --user-agent "NeuroFriend-build/2.1.0" $modelUrl -o "bundle\models\Qwen2.5-3B-Instruct-Q4_K_S.gguf"
          if ($LASTEXITCODE -ne 0) { throw "Model download failed after retries; Hugging Face may still be rate-limiting this runner" }
          $model = Get-Item "bundle\models\Qwen2.5-3B-Instruct-Q4_K_S.gguf"
          if ($model.Length -lt 1000000000) { throw "Downloaded model file is unexpectedly small" }
          curl.exe -L --fail --retry 12 --retry-all-errors --retry-delay 10 --retry-max-time 600 --user-agent "NeuroFriend-build/2.1.0" "https://huggingface.co/Qwen/Qwen2.5-3B-Instruct/resolve/main/LICENSE?download=true" -o "bundle\models\QWEN_LICENSE.txt"
          if ($LASTEXITCODE -ne 0) { throw "Qwen model license download failed after retries" }
          Write-Host ("Model size: {0:N2} GiB" -f ($model.Length / 1GB))
      - name: Build official llama.cpp CPU runtime
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama-runtime-src
          if ($LASTEXITCODE -ne 0) { throw "llama.cpp source download failed" }
          cmake -S llama-runtime-src -B llama-runtime-src\build -A x64 -DLLAMA_BUILD_SERVER=ON -DGGML_NATIVE=OFF -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "llama.cpp CMake configuration failed" }
          cmake --build llama-runtime-src\build --config Release --target llama-server --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "llama.cpp CPU runtime build failed" }
          $server = Get-ChildItem -Path llama-runtime-src\build -Filter "llama-server.exe" -Recurse | Where-Object { $_.FullName -match "[\\/]bin[\\/]" } | Select-Object -First 1
          if (-not $server) { throw "Built llama-server.exe was not found" }
          Copy-Item -Path (Join-Path $server.Directory.FullName "*") -Destination "bundle\runtime" -Recurse -Force
          if (-not (Test-Path "bundle\runtime\llama-server.exe")) { throw "Runtime assembly failed" }
          if (Test-Path "llama-runtime-src\LICENSE") { Copy-Item "llama-runtime-src\LICENSE" "bundle\runtime\LLAMA_CPP_LICENSE.txt" }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
      - name: Build one-file installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Qp setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          $installer = Get-Item "dist\NeuroFriend-Setup.exe"
          if ($installer.Length -gt 2147483648) { throw "Installer exceeds GitHub Release's 2 GiB per-asset limit" }
          Write-Host ("Installer size: {0:N2} GiB" -f ($installer.Length / 1GB))
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeuroFriend-All-in-One-Installer
          path: dist/NeuroFriend-Setup.exe
          if-no-files-found: error
          retention-days: 7
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Build bundled NeuroFriend release'))
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.1.0' }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.1.0' }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          overwrite_files: true
          files: dist/NeuroFriend-Setup.exe
